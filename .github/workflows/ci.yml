name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and start services
      run: |
        docker-compose -f docker-compose.ci.yml up -d --build
        
    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        sleep 45
        
        # Wait for backend to be ready
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 3
        done
        
        # Wait for frontend to be ready
        for i in {1..30}; do
          if curl -s http://localhost:3000 > /dev/null; then
            echo "Frontend is ready"
            break
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 3
        done

    - name: Show service logs
      if: failure()
      run: |
        echo "=== Backend logs ==="
        docker-compose -f docker-compose.ci.yml logs backend
        echo "=== Frontend logs ==="
        docker-compose -f docker-compose.ci.yml logs frontend
        echo "=== MySQL logs ==="
        docker-compose -f docker-compose.ci.yml logs mysql

    - name: Run Backend Unit Tests (pytest)
      run: |
        docker-compose -f docker-compose.ci.yml exec -T backend python -m pytest test_main.py -v --tb=short

    - name: Run Backend API Tests
      run: |
        docker-compose -f docker-compose.ci.yml exec -T backend python simple_test.py

    - name: Run Frontend Tests
      run: |
        docker-compose -f docker-compose.ci.yml exec -T frontend npm test -- --watchAll=false --coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
      continue-on-error: true

    - name: Cleanup
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml down -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint || true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run Python linting (flake8)
      run: |
        cd backend
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.ci.yml build

    - name: Test Docker images
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        sleep 45
        
        # Quick smoke test
        curl -f http://localhost:8000/health
        curl -f http://localhost:3000
        
        docker-compose -f docker-compose.ci.yml down 