name: PR Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install flake8

    - name: Run TypeScript check
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Run Python linting
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check Docker builds
      run: |
        docker build -t todo-backend ./backend
        docker build -t todo-frontend ./frontend

  comment-pr:
    runs-on: ubuntu-latest
    needs: quick-check
    if: always()
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🤖 PR Check Results')
          );
          
          const success = '${{ needs.quick-check.result }}' === 'success';
          const body = success 
            ? '🤖 PR Check Results\n\n✅ All quick checks passed! Ready for full CI/CD pipeline.'
            : '🤖 PR Check Results\n\n❌ Some quick checks failed. Please review the errors above.';
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          } 